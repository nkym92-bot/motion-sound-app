<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>モーションサウンドアプリ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🚶‍♂️ モーションサウンド</h1>

    <div class="status-card">
      <div class="status-item">
        <span class="label">状態:</span>
        <span id="status" class="value">待機中</span>
      </div>
      <div class="status-item">
        <span class="label">歩数:</span>
        <span id="stepCount" class="value">0</span>
      </div>
      <div class="status-item">
        <span class="label">ジャンプ:</span>
        <span id="jumpCount" class="value">0</span>
      </div>
      <div class="status-item">
        <span class="label">あけおめ:</span>
        <span id="greetCount" class="value">0</span>
      </div>
      <div class="status-item">
        <span class="label">最後:</span>
        <span id="lastEvent" class="value small">-</span>
      </div>
    </div>

    <div class="sensor-data">
      <div class="sensor-item">
        <span class="sensor-label">X:</span>
        <span id="accelX" class="sensor-value">0.00</span>
      </div>
      <div class="sensor-item">
        <span class="sensor-label">Y:</span>
        <span id="accelY" class="sensor-value">0.00</span>
      </div>
      <div class="sensor-item">
        <span class="sensor-label">Z:</span>
        <span id="accelZ" class="sensor-value">0.00</span>
      </div>
    </div>

    <div class="settings-card">
      <div class="setting-row">
        <label class="check">
          <input type="checkbox" id="keepAwake" checked />
          画面スリープ防止（対応端末のみ）
        </label>
      </div>

      <div class="setting-row">
        <label class="check">
          <input type="checkbox" id="ttsEnabled" checked />
          「あけおめ」読み上げ
        </label>
      </div>

      <div class="setting-row">
        <label class="range">
          音量
          <input type="range" id="volume" min="0" max="100" value="70" />
          <span id="volumeValue">70</span>
        </label>
      </div>
    </div>

    <button id="startBtn" class="btn btn-primary">スタート</button>
    <button id="stopBtn" class="btn btn-secondary" disabled>ストップ</button>

    <div class="info">
      <p>📱 画面を開いたまま歩くと「ポンポン」、ジャンプでジャンプ音。</p>
      <p>🗡️ 持ち上げて切り捨てるような動作で「あけましておめでとうございます」</p>
      <p>⚠️ iPhoneは最初に許可が必要。バックグラウンド/スリープ中は鳴りません。</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
